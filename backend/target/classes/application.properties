# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# SQL SERVER DATABASE CONNECTION
# Replace these with your actual Azure SQL / local SQL Server details
# ==========================
spring.datasource.url=jdbc:sqlserver://recipebook-sql-server.database.windows.net:1433;database=RecipeBookDB;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=recipebookadmin@recipebook-sql-server
spring.datasource.password=RecipeBook#2026Secure
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# JWT CONFIG
# IMPORTANT: change this secret before deploying, keep it out of git in real use
# ==========================
jwt.secret=RecipeBookSuperSecretKeyForJWTSigning2026ChangeThisInProduction
jwt.expiration.ms=86400000

# ==========================
# CORS - allow Flutter web frontend to call this API
# Update with your deployed frontend URL
# ==========================
app.cors.allowed-origins=http://localhost:5000,http://localhost:8000,https://your-frontend-url.web.app
