# ==========================
# SERVER
# ==========================
server.port=${PORT:8080}

# ==========================
# POSTGRESQL DATABASE CONNECTION (Supabase)
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# JWT CONFIG
# ==========================
jwt.secret=RecipeBookSuperSecretKeyForJWTSigning2026ChangeThisInProduction
jwt.expiration.ms=86400000

# ==========================
# CORS - allow Flutter web frontend to call this API
# ==========================
app.cors.allowed-origins=http://localhost:5000,http://localhost:8000,https://your-frontend-url.web.app